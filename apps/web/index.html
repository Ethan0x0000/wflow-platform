<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wflow-pro-next工作流</title>
  <style type="text/css">
      body {
          margin: 0;
      }

      .loading {
          //background: #1989fa;
          color: #1989fa;
          width: 100%;
          height: 100vh;
          display: flex;
          flex-direction: column;
          font-size: 1.5rem;
          gap: 0.2em;
          font-weight: bold;
          justify-content: center;
          align-items: center;
      }

      .loading-text span {
          animation: heartbeat 1.5s ease-in-out infinite;
          display: inline-block;
      }

      @keyframes heartbeat {
          0%, 100% {
              transform: scale(1);
              opacity: 0.8;
          }
          50% {
              transform: scale(1.5);
              opacity: 1;
          }
      }

      /* Add delays to create the wave effect */
      .loading-text span:nth-child(1) {
          animation-delay: 0s;
      }

      .loading-text span:nth-child(2) {
          animation-delay: 0.1s;
      }

      .loading-text span:nth-child(3) {
          animation-delay: 0.2s;
      }

      .loading-text span:nth-child(4) {
          animation-delay: 0.3s;
      }

      .loading-text span:nth-child(5) {
          animation-delay: 0.4s;
      }

      .loading-text span:nth-child(6) {
          animation-delay: 0.5s;
      }

      .loading-text span:nth-child(7) {
          animation-delay: 0.6s;
      }

      .loading-text span:nth-child(8) {
          animation-delay: 0.7s;
      }

      .loading-text span:nth-child(9) {
          animation-delay: 0.8s;
      }

      .loading-text span:nth-child(10) {
          animation-delay: 0.9s;
      }
  </style>
</head>
<body>
<div id="app"></div>
<div id="w-init-loading" class="loading">
  <div class="loading-text">
    <span>w</span>
    <span>f</span>
    <span>l</span>
    <span>o</span>
    <span>w</span>
    <span>-</span>
    <span>p</span>
    <span>r</span>
    <span>o</span>
    <span>-</span>
    <span>n</span>
    <span>e</span>
    <span>x</span>
    <span>t</span>
  </div>
  <div style="font-size: 1rem; margin-top: 10px">努力加载中</div>
</div>
<script type="module" src="/src/main.js"></script>
<script>
  /*全局注册移除loading函数*/
  window.removeLoading = () => document.getElementById("w-init-loading")?.remove()
</script>
</body>
</html>
